<div *ngIf="isLoading" class="loader" [class.is-exiting]="isLoaderExiting" aria-live="polite" aria-label="Loading portfolio">
  <div class="loader-progress" aria-hidden="true">
    <span [style.width.%]="loadingProgress"></span>
  </div>
  <p class="loader-number">{{ loadingProgress }}</p>
</div>

<div class="app-shell" [class.is-ready]="isLoaderExiting || !isLoading">
  <header class="site-header">
    <a href="#top" class="brand" aria-label="Prakriti Biswas, home">P<span>°</span>B</a>
    <p class="header-role">Design-minded developer<br>based in Toronto</p>
    <nav class="nav-links" aria-label="Primary navigation">
      <a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a>
    </nav>
    <button class="theme-toggle" (click)="toggleTheme()" aria-label="Invert page colours">◐</button>
  </header>

  <main id="top">
    <app-hero></app-hero>
    <app-projects></app-projects>
    <app-about></app-about>
    <app-experience></app-experience>
    <section id="contact" class="contact-section">
      <p class="eyebrow">05 / Get in touch</p>
      <p class="contact-kicker">Have a thoughtful product<br>in mind?</p>
      <a class="contact-email" href="mailto:prakriti@example.com">Let's make it real <span>↗</span></a>
      <div class="contact-foot"><span>© {{ currentYear }} Prakriti Biswas</span><span>Interfaces · AI systems · Motion</span></div>
    </section>
  </main>
</div>
